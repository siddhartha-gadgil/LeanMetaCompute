name = "MetaCompute"
testRunner = "MetaComputeTest"
defaultTargets = ["MetaCompute"]

[leanOptions]
pp.unicode.fun = true
pp.proofs.withType = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[require]]
name="LeanAideCore"
git="https://github.com/siddhartha-gadgil/LeanAide.git"
rev="main"
subDir="LeanAideCore"

[[lean_lib]]
name = "MetaCompute"

[[lean_lib]]
name = "MetaComputeTest"
